# Single source of truth for every experiment parameter in this study.
#
# Nothing below may be hardcoded in a script: read it through poi_audit.config.
# Figure style and export numbers are not experiment parameters and live in the
# style layer (poi_audit/figstyle.py) instead, so that each number has one home.
#
# Secrets are never stored here. Names ending in _env hold the name of an
# environment variable, read from .env at runtime.

project:
  name: poi-name-audit
  seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  responses: data/responses
  logs: logs
  figures: paper/figures
  tables: paper/tables

# The efficiency profile was planned into a PostgreSQL schema and is written to
# files instead: it is the one output a reader of the deposit has to be able to
# reproduce without standing up a server, and it is a few thousand rows. The
# responses go to JSONL as they arrive and the per-model summary to CSV.

# ---------------------------------------------------------------------------
# Corpus
# Twelve cities, two by two on language and data maturity, Latin script held
# constant. The city list and the extraction date are part of the corpus
# definition and are written here when the extraction runs. Maturity is measured, never
# assumed, and the selected list is filled in by hand from the rule's proposal.
# ---------------------------------------------------------------------------
corpus:
  source: OpenStreetMap
  licence: ODbL
  script: Latin
  extraction_date: 2026-08-02
  design_cells:
    language: [english, non_english]
    maturity: [mature, developing]
  cities_per_cell: 3
  # The twelve selected by the rule in candidate_selection, written here by hand
  # after the proposal was read. Maturity is the measured assignment, not the
  # hypothesis. The measurement that produced them is in
  # data/processed/candidate_city_counts.csv.
  cities:
    - {city: Vancouver, country: CA, lat: 49.2827, lon: -123.1207,
       language: english, maturity: mature}
    - {city: London, country: GB, lat: 51.5074, lon: -0.1278,
       language: english, maturity: mature}
    - {city: Cork, country: IE, lat: 51.8985, lon: -8.4756,
       language: english, maturity: mature}
    - {city: Cebu, country: PH, lat: 10.3157, lon: 123.8854,
       language: english, maturity: developing}
    - {city: Nairobi, country: KE, lat: -1.2864, lon: 36.8172,
       language: english, maturity: developing}
    - {city: Accra, country: GH, lat: 5.6037, lon: -0.187,
       language: english, maturity: developing}
    - {city: Munich, country: DE, lat: 48.1351, lon: 11.582,
       language: non_english, maturity: mature}
    - {city: Rotterdam, country: NL, lat: 51.9244, lon: 4.4777,
       language: non_english, maturity: mature}
    - {city: Brno, country: CZ, lat: 49.1951, lon: 16.6068,
       language: non_english, maturity: mature}
    - {city: Cuenca, country: EC, lat: -2.9001, lon: -79.0059,
       language: non_english, maturity: developing}
    - {city: Surabaya, country: ID, lat: -7.2575, lon: 112.7521,
       language: non_english, maturity: developing}
    - {city: İzmir, country: TR, lat: 38.4237, lon: 27.1428,
       language: non_english, maturity: developing}

  # A point of interest is an element carrying any of these keys. The set is
  # fixed here so that the candidate measurement and the corpus extraction
  # count the same thing.
  poi_keys: [amenity, shop, tourism, leisure, office, craft, healthcare]

  # Candidate measurement
  #
  # Every candidate below is measured, then twelve are selected by the rule that
  # follows. The thresholds and the counting geometry were fixed before any
  # candidate was measured and are unchanged since the pilot.
  #
  # Counts are taken inside a disc of fixed radius around the city centre
  # rather than inside an administrative boundary, because boundary area varies
  # by two orders of magnitude between countries and would make density
  # incomparable across the design cells.
  candidate_selection:
    radius_m: 10000
    overpass_url: https://overpass-api.de/api/interpreter
    overpass_timeout_sec: 300
    pause_between_cities_sec: 5

    # Each metric counts point-of-interest elements satisfying its filters.
    # A candidate failing any threshold is eliminated before the density
    # ranking. Thresholds carry a factor of about ten over the per-city item
    # quota, so that no class draws a near-exhaustive sample of a rare tag.
    metrics:
      named:
        require_all: [name]
        threshold: 3000
      phone:
        require_all: [name]
        require_any: [phone, "contact:phone"]
        threshold: 200
      opening_hours:
        require_all: [name, opening_hours]
        threshold: 100
      website:
        require_all: [name]
        require_any: [website, "contact:website"]
        threshold: 100
      address:
        require_all: [name, "addr:city", "addr:street"]
        threshold: 100

    # Maturity is assigned from measured attribute completeness: the mean of
    # the shares of named points of interest carrying a phone number, opening
    # hours, a web address and a street address. The hypothesis recorded
    # against each candidate is written down only so that a wrong one is
    # visible in the output.
    #
    # This replaces a first rule that ranked candidates by the count of named
    # points of interest per square kilometre. That rule was fixed before the
    # measurement and applied, and it placed Lima and Quito in the mature cell
    # and Utrecht in the developing one: it measures how dense a city is, not
    # how completely its records are attributed, and the design's maturity axis
    # means the second. The study also needs records that carry the fields its
    # error classes corrupt, which is the same quantity. The superseded ranking
    # and the selection it produced are recorded in the progress file, because
    # the rule was changed after its numbers were seen and that has to stay
    # visible. The elimination thresholds are untouched.
    ranking_metric: attribute_completeness
    completeness_metrics: [phone, opening_hours, website, address]
    country_diversity_required: true

  # The density map's measurement parameters are under `figures.f1`, which is
  # where the figure generator reads them. They were briefly written here as
  # well, at a different cell size, which left one number with two homes and two
  # values; the copy is gone and the figure's block is the only one.

  # Candidate pool
  #
  # Built mechanically so that no city's presence depends on what an earlier
  # measurement showed: a fixed list of countries, and the three largest cities
  # of each by urban population. Cities are never added one at a time.
  #
  # The country list is the one the pilot used, minus Australia. No point of
  # interest in the Melbourne disc carries addr:city, because the country tags
  # addresses with addr:suburb instead; its cities cannot carry the
  # address-consistency error class, and that is a property of the tagging
  # convention rather than of the data. The pilot and what it settled are in
  # data/processed/pilot.
  #
  # The language of a country is a design fact and is written here. Maturity is
  # not: the hypothesis recorded against each city exists only so that a wrong
  # one is visible in the output, and the cells are filled from measurement.
  candidates:
    - {city: London, country: GB, lat: 51.5074, lon: -0.1278,
       language: english, hypothesis_maturity: mature}
    - {city: Birmingham, country: GB, lat: 52.4862, lon: -1.8904,
       language: english, hypothesis_maturity: mature}
    - {city: Manchester, country: GB, lat: 53.4808, lon: -2.2426,
       language: english, hypothesis_maturity: mature}
